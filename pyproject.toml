[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uniden-r8-ble"
version = "0.1.0"
description = "Receive-only Uniden R8 Bluetooth LE integration: live telemetry, lossless radar alert events, local history and feeds"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Jeremy Whittaker"}]
# bleak is NOT a hard dependency.  The safety gate, the redaction and the
# classification must import and be testable on a machine with no Bluetooth
# stack; only the live scan needs a radio, and it imports bleak lazily.
dependencies = []

[project.optional-dependencies]
# The radio.  Needed by scan, pair, identity, live, collect and inspect; not by
# plan, selftest, config or history.
ble = ["bleak>=0.21,<4"]
# Publication to an MQTT broker.  Optional because most installations have no
# broker, and because paho's 2.x callback API is a breaking change from the 1.x
# that Debian ships -- pinning >=2 and installing from PyPI avoids running the
# one the distribution happens to carry.
mqtt = ["paho-mqtt>=2,<3"]
dev = ["pytest>=8", "ruff>=0.8"]
# Everything.  The history (SQLite) and the gpsd client (sockets) and the local
# feed (asyncio) are standard library only and need no extra at all.
all = ["bleak>=0.21,<4", "paho-mqtt>=2,<3"]

[project.scripts]
uniden-r8 = "uniden_r8.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "PL"]
ignore = ["PLR0912", "PLR0915", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
# The CLI defers importing `pairing` (which needs subprocess) and `identity`
# (which needs bleak) into the subcommands that use them, so `plan` and
# `selftest` stay runnable — and provably inert — on a node with neither.
"src/uniden_r8/cli.py" = ["PLC0415", "PLR0911"]
# Tests import inside the test body on purpose: several of them assert on
# import-time behaviour (that `plan` never pulls in bleak, for instance), which
# a module-level import would defeat.
"tests/*" = ["PLC0415"]
