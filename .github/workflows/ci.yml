name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ble,dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  # This job installs without the `ble` extra and still runs `plan` and
  # `selftest`. It proves the safety gate and the read-only probe plan work
  # on a machine with no Bluetooth stack installed, which is a property this
  # project cares about.
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (no ble extra)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Plan
        run: python -m uniden_r8.cli plan
      - name: Selftest
        run: python -m uniden_r8.cli selftest
